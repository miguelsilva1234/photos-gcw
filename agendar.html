<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos</title>

    <link rel="stylesheet" href="agendar.css">

    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <h1>Agendamentos</h1>

        <div class="linha">
            <label>Selecione o seu pacote:</label>

            <select class="pacote">
                <option>premium</option>
                <option>comum</option>
            </select>
        </div>

        <div class="linha">
            <label>Selecione a data:</label>

            <input type="date" class="data">
        </div>

        <div class="linha">
            <label>Insira seus dados:</label>

            <input type="text" class="dados" placeholder="email/número">
        </div>

        <div class="logo">
            <img src="img/logo.jpeg" alt="Logo">
        </div>

        <a href="index.html" class="btn-confirmar">
            Confirmar agenmdamento
        </a>

        <a href="index.html" class="voltar">
            Voltar ao início
        </a>

    </div>

</body>
</html>

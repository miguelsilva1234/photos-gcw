<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lima Photos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FONTE -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>

<body>

    <!-- MENU -->

    <header>

        <div class="logo-menu">
            Lima Photos
        </div>

        <nav>

            <ul class="menu">

                <li>
                    <a href="#inicio">Início</a>
                </li>

                <li>
                    <a href="#sobre">Sobre</a>
                </li>

                <li>
                    <a href="#servicos">Serviços</a>
                </li>

            </ul>

        </nav>

        <!-- MENU MOBILE -->

        <div class="menu-mobile" id="menu-mobile">
            ☰
        </div>

    </header>


    <!-- TELA INICIAL -->

    <section class="inicio" id="inicio">

        <div class="logo-box">

            <img src="img/logo.jpeg" alt="Logo Lima Photos">

        </div>

    </section>


    <!-- SOBRE -->

    <section class="sobre" id="sobre">

        <div class="logo-topo">

            <img src="img/logo.jpeg" alt="Logo">

        </div>

        <div class="texto-sobre">

            <p>
                Olá, esta é a Lima Photos, uma empresa de fotografia
                que tem seu principal foco em casamentos e eventos
                sociais. Temos o melhor serviço com o melhor custo
                benefício do mercado.
            </p>

        </div>

    </section>


    <!-- SERVIÇOS -->

    <section class="servicos" id="servicos">

        <div class="titulo">

            <h1>
                Seja bem-vindo!
            </h1>

            <hr>

        </div>


        <div class="cards">

            <!-- CARD 1 -->

            <div class="card">

                <a href="casamento.html">
                    <h2>Casamento</h2>
                </a>

                <img src="img/casamento.jpeg" alt="Casamento">

            </div>


            <!-- CARD 2 -->

            <div class="card">

                <a href="ensaio.html">
                    <h2>Ensaios</h2>
                </a>
                
                <img src="img/ensaio.jpeg" alt="Casamento">

            </div>


            <!-- CARD 3 -->

            <div class="card">

                <a href="sobremim.html">
                    <h2>Sobre mim</h2>
                </a>

                <img src="img/rafael.png" alt="Casamento">

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
